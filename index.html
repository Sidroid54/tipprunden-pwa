<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tipprunden-Tracker</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: sans-serif; padding: 15px; font-size: 16px; }
    h1, h2 { text-align: center; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background-color: #eee; }
    input { width: 60px; font-size: 16px; padding: 5px; }
    button { padding: 10px 20px; font-size: 16px; margin: 5px 0; width: 100%; }
    
    /* Mobile: horizontales Scrollen */
    .table-container {
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Tipprunden-Tracker</h1>
  
  <h2>Spieltag eingeben</h2>
  <div class="table-container">
    <table id="eingabeTabelle">
      <thead>
        <tr>
          <th>Spieler</th>
          <th>TS-Rohpunkte</th>
          <th>MS-Rohpunkte</th>
        </tr>
      </thead>
      <tbody>
        <!-- Zeilen per JS -->
      </tbody>
    </table>
  </div>
  <button onclick="addSpieltag()">Spieltag speichern</button>

  <h2>Gesamtrangliste</h2>
  <div class="table-container">
    <table id="rangliste">
      <thead>
        <tr>
          <th>Platz</th>
          <th>Spieler</th>
          <th>Punkte</th>
        </tr>
      </thead>
      <tbody>
        <!-- Rangliste -->
      </tbody>
    </table>
  </div>

  <script>
    const teilnehmer = ["Björn","Jan","Marcus","Marius","Kai","Alex","Tim","Daniel","Simon"];
    let spieltage = JSON.parse(localStorage.getItem("spieltage")) || [];

    // Eingabetabelle erzeugen
    const tbody = document.querySelector("#eingabeTabelle tbody");
    teilnehmer.forEach(name => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${name}</td>
                      <td><input type="number" min="0" value="0"></td>
                      <td><input type="number" min="0" value="0"></td>`;
      tbody.appendChild(tr);
    });

    const rankingPunkte = [10,8,7,6,5,4,3,2,1];

    function computePoints(rawScores) {
      rawScores.sort((a,b)=>b.score-a.score);
      let points = {};
      let i = 0;
      while(i < rawScores.length){
        const currentScore = rawScores[i].score;
        let tieCount = 1;
        while(i+tieCount<rawScores.length && rawScores[i+tieCount].score===currentScore) tieCount++;
        for(let j=0;j<tieCount;j++) points[rawScores[i+j].name] = rankingPunkte[i] || 0;
        i += tieCount;
      }
      return points;
    }

    function addSpieltag(){
      const rows = document.querySelectorAll("#eingabeTabelle tbody tr");
      let tsRaw=[], msRaw=[];
      rows.forEach(row=>{
        const name = row.cells[0].innerText;
        const ts = parseInt(row.cells[1].querySelector("input").value) || 0;
        const ms = parseInt(row.cells[2].querySelector("input").value) || 0;
        tsRaw.push({name:name, score:ts});
        msRaw.push({name:name, score:ms});
      });
      const tsPoints = computePoints(tsRaw);
      const msPoints = computePoints(msRaw);
      spieltage.push({tsPoints, msPoints});
      localStorage.setItem("spieltage", JSON.stringify(spieltage));
      alert("Spieltag gespeichert!");
      updateRangliste();
    }

    function updateRangliste(){
      let gesamt = {};
      teilnehmer.forEach(name=>gesamt[name]=0);
      spieltage.forEach(st=>{
        teilnehmer.forEach(name=>gesamt[name]+=(st.tsPoints[name]||0)+(st.msPoints[name]||0));
      });
      const sorted = Object.entries(gesamt).sort((a,b)=>b[1]-a[1]);
      const tbodyR = document.querySelector("#rangliste tbody");
      tbodyR.innerHTML="";
      sorted.forEach(([name,punkte],index)=>{
        const tr = document.createElement("tr");
        tr.innerHTML=`<td>${index+1}</td><td>${name}</td><td>${punkte}</td>`;
        tbodyR.appendChild(tr);
      });
    }

    updateRangliste();
  </script>
</body>
</html>
