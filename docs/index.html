<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#ffffff">

  <title>Tasmania Hackentrick</title>

  <link
    rel="manifest"
    href="/tipprunden-pwa/manifest.json"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="/tipprunden-pwa/assets/icon-tasmania-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="/tipprunden-pwa/assets/icon-tasmania-192.png"
  >

  <style>
    :root {
      --navy: #0b1f3a;
      --navy-light: #17365f;
      --navy-soft: #e9eef5;

      --red: #c81d25;
      --red-dark: #98151b;
      --red-soft: #fdecee;

      --white: #ffffff;
      --background: #f3f5f8;
      --surface: #ffffff;

      --text: #172033;
      --muted: #6b7480;
      --border: #dce1e8;

      --gold: #c7921e;
      --gold-soft: #fff5d6;

      --silver: #7f8a97;
      --silver-soft: #f0f2f5;

      --bronze: #a86437;
      --bronze-soft: #f7ece4;

      --shadow:
        0 8px 24px rgb(11 31 58 / 8%);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    [hidden] {
      display: none !important;
    }

    header {
      position: relative;
      overflow: hidden;
      padding: 17px 16px 19px;
      border-bottom: 4px solid var(--red);
      background:
        linear-gradient(
          135deg,
          #ffffff,
          #f1f3f6
        );
      color: var(--navy);
    }

    header::after {
      content: "";
      position: absolute;
      right: -95px;
      bottom: -145px;
      width: 250px;
      height: 250px;
      border: 34px solid rgb(11 31 58 / 3%);
      border-radius: 50%;
      pointer-events: none;
    }

    .header-content,
    main {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    .brand-line {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-logo {
      display: block;
      width: 84px;
      height: 84px;
      flex: 0 0 auto;
      border-radius: 50%;
      object-fit: contain;
      filter:
        drop-shadow(
          0 5px 10px rgb(11 31 58 / 18%)
        );
    }

    header h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(1.65rem, 7vw, 2.7rem);
      line-height: 1.05;
    }

    header p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    main {
      padding: 18px 12px 42px;
    }

    .tabs {
      position: sticky;
      z-index: 10;
      top: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 18px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgb(243 245 248 / 94%);
      box-shadow:
        0 6px 20px rgb(11 31 58 / 8%);
      backdrop-filter: blur(12px);
    }

    .tab-button {
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--navy);
      font-weight: 800;
    }

    .tab-button.active {
      background: var(--red);
      color: var(--white);
      box-shadow:
        0 4px 12px rgb(200 29 37 / 25%);
    }

    .matchday-controls {
      margin-bottom: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--white);
      box-shadow: var(--shadow);
    }

    .matchday-controls label,
    .season-controls label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .matchday-select,
    .season-matchday-select {
      width: 100%;
      min-height: 44px;
      padding: 8px 36px 8px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: var(--white);
      color: var(--navy);
      font-weight: 800;
      cursor: pointer;
    }

    .matchday-select:focus,
    .season-matchday-select:focus {
      border-color: var(--red);
      box-shadow:
        0 0 0 3px rgb(200 29 37 / 13%);
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
      padding: 20px;
      border-radius: 20px;
      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--navy-light)
        );
      color: var(--white);
      box-shadow: var(--shadow);
    }

    .hero-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      background: var(--red);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      right: -35px;
      bottom: -52px;
      width: 150px;
      height: 150px;
      border: 25px solid rgb(255 255 255 / 7%);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-label {
      position: relative;
      z-index: 1;
      color: rgb(255 255 255 / 72%);
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .hero-value {
      position: relative;
      z-index: 1;
      margin-top: 6px;
      overflow-wrap: anywhere;
      font-size: clamp(1.65rem, 8vw, 2.5rem);
      font-weight: 900;
      line-height: 1.1;
    }

    .summary-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .summary-card {
      min-width: 0;
      padding: 15px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .summary-value {
      margin-top: 6px;
      overflow-wrap: anywhere;
      color: var(--navy);
      font-size: 1.18rem;
      font-weight: 850;
    }

    .summary-card.red-accent {
      border-top: 4px solid var(--red);
    }

    .summary-card.navy-accent {
      border-top: 4px solid var(--navy);
    }

    .ranking-card {
      overflow: hidden;
    }

    .section-heading {
      padding: 18px 16px 15px;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--navy);
      font-size: 1.28rem;
    }

    .season-heading-block {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 13px;
    }

    .season-controls {
      width: min(100%, 280px);
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px 12px;
      border-top: 1px solid var(--border);
      text-align: center;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      background: #f8f9fb;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    tbody tr:hover {
      background: #f8f9fb;
    }

    tbody tr.podium-1 {
      background:
        linear-gradient(
          90deg,
          var(--gold-soft),
          #ffffff 55%
        );
    }

    tbody tr.podium-2 {
      background:
        linear-gradient(
          90deg,
          var(--silver-soft),
          #ffffff 52%
        );
    }

    tbody tr.podium-3 {
      background:
        linear-gradient(
          90deg,
          var(--bronze-soft),
          #ffffff 52%
        );
    }

    tbody tr.is-me {
      background:
        linear-gradient(
          90deg,
          #fbdde0,
          #fff4f5 48%,
          #ffffff 82%
        ) !important;
      box-shadow:
        inset 7px 0 0 var(--red),
        inset 0 0 0 2px rgb(200 29 37 / 40%);
    }

    .rank-badge {
      display: inline-grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      background: var(--navy-soft);
      color: var(--navy);
      font-size: 0.88rem;
      font-weight: 900;
    }

    .rank-badge.rank-1 {
      width: 38px;
      height: 38px;
      background: var(--gold);
      color: var(--white);
      font-size: 1rem;
      box-shadow:
        0 4px 10px rgb(199 146 30 / 25%);
    }

    .rank-badge.rank-2 {
      background: var(--silver);
      color: var(--white);
    }

    .rank-badge.rank-3 {
      background: var(--bronze);
      color: var(--white);
    }

    .player {
      color: var(--navy);
      font-weight: 800;
    }

    tbody tr.is-me .player {
      color: var(--red-dark);
      font-weight: 950;
    }

    .you-badge {
      display: inline-flex;
      align-items: center;
      margin-left: 7px;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--red);
      color: var(--white);
      box-shadow:
        0 3px 8px rgb(200 29 37 / 24%);
      font-size: 0.67rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      vertical-align: middle;
    }

    .ts-value {
      color: var(--red-dark);
      font-weight: 850;
    }

    .ms-value {
      color: var(--navy);
      font-weight: 850;
    }

    .total {
      color: var(--red-dark);
      font-size: 1.05rem;
      font-weight: 900;
    }

    .raw {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .trend {
      display: inline-flex;
      min-width: 44px;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 0.8rem;
      font-weight: 850;
    }

    .trend-up {
      color: #18743c;
    }

    .trend-down {
      color: var(--red-dark);
    }

    .trend-same {
      color: var(--muted);
    }

    .desktop-ranking {
      display: block;
    }

    .mobile-ranking {
      display: none;
      padding: 0 12px 14px;
    }

    .ranking-list {
      display: grid;
      gap: 10px;
    }

    .ranking-item {
      position: relative;
      display: grid;
      grid-template-columns:
        42px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      overflow: hidden;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--white);
    }

    .ranking-item::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--navy);
    }

    .ranking-item.place-1 {
      min-height: 94px;
      padding-top: 17px;
      padding-bottom: 17px;
      border-color: rgb(199 146 30 / 55%);
      background:
        linear-gradient(
          100deg,
          var(--gold-soft),
          var(--white) 60%
        );
      box-shadow:
        0 8px 20px rgb(199 146 30 / 12%);
    }

    .ranking-item.place-2 {
      background:
        linear-gradient(
          100deg,
          var(--silver-soft),
          var(--white) 58%
        );
    }

    .ranking-item.place-3 {
      background:
        linear-gradient(
          100deg,
          var(--bronze-soft),
          var(--white) 58%
        );
    }

    .ranking-item.place-1::before {
      width: 6px;
      background: var(--gold);
    }

    .ranking-item.place-2::before {
      background: var(--silver);
    }

    .ranking-item.place-3::before {
      background: var(--bronze);
    }

    .ranking-item.is-me {
      border: 2px solid var(--red);
      background:
        linear-gradient(
          105deg,
          #fbdde0,
          #fff1f3 52%,
          #ffffff 90%
        );
      box-shadow:
        0 8px 20px rgb(200 29 37 / 17%),
        inset 0 0 0 1px rgb(255 255 255 / 70%);
    }

    .ranking-item.is-me::before {
      width: 7px;
      background: var(--red);
    }

    .ranking-item.is-me .mobile-player-name {
      color: var(--red-dark);
      font-weight: 950;
    }

    .mobile-player {
      min-width: 0;
    }

    .mobile-player-name {
      overflow: hidden;
      color: var(--navy);
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ranking-item.place-1 .mobile-player-name {
      font-size: 1.08rem;
      font-weight: 950;
    }

    .mobile-details {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 7px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .points-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 7px;
      border-radius: 999px;
      font-weight: 800;
    }

    .points-badge.ts {
      background: var(--red-soft);
      color: var(--red-dark);
    }

    .points-badge.ms {
      background: var(--navy-soft);
      color: var(--navy);
    }

    .mobile-total {
      min-width: 48px;
      color: var(--red-dark);
      font-size: 1.22rem;
      font-weight: 950;
      text-align: right;
    }

    .ranking-item.place-1 .mobile-total {
      font-size: 1.45rem;
    }

    .mobile-total-label {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .mobile-trend {
      margin-top: 5px;
      text-align: right;
    }

    .status {
      padding: 22px;
      color: var(--muted);
      text-align: center;
    }

    .error {
      color: var(--red-dark);
    }

    footer {
      padding: 22px 12px 28px;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    .change-player-button {
      display: block;
      margin: 9px auto 0;
      padding: 4px 8px;
      border: 0;
      background: transparent;
      color: var(--navy);
      font-size: 0.76rem;
      font-weight: 750;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .player-dialog-backdrop {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgb(11 31 58 / 56%);
      backdrop-filter: blur(5px);
    }

    .player-dialog {
      width: min(100%, 420px);
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--white);
      box-shadow:
        0 22px 60px rgb(11 31 58 / 28%);
    }

    .player-dialog h2 {
      margin: 0;
      color: var(--navy);
      font-size: 1.35rem;
    }

    .player-dialog p {
      margin: 8px 0 18px;
      color: var(--muted);
      line-height: 1.45;
    }

    .player-dialog select {
      width: 100%;
      min-height: 46px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--white);
      color: var(--navy);
      font-weight: 800;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 18px;
    }

    .dialog-button {
      min-height: 42px;
      padding: 8px 14px;
      border: 0;
      border-radius: 10px;
      font-weight: 850;
    }

    .dialog-button.primary {
      background: var(--red);
      color: var(--white);
    }

    .dialog-button.secondary {
      background: var(--navy-soft);
      color: var(--navy);
    }

    @media (max-width: 650px) {
      header {
        padding-top: 14px;
        padding-bottom: 16px;
      }

      .brand-line {
        gap: 11px;
      }

      .brand-logo {
        width: 70px;
        height: 70px;
      }

      header p {
        margin-top: 5px;
        font-size: 0.84rem;
      }

      main {
        padding-right: 10px;
        padding-left: 10px;
      }

      .season-controls {
        width: 100%;
      }

      .desktop-ranking {
        display: none;
      }

      .mobile-ranking {
        display: block;
      }

      .ranking-card {
        overflow: visible;
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      .ranking-card > .section-heading {
        margin-bottom: 10px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--white);
        box-shadow: var(--shadow);
      }
    }

    @media (min-width: 720px) {
      main {
        padding-top: 24px;
      }

      .summary-grid {
        gap: 14px;
      }

      .matchday-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .matchday-controls label {
        margin-bottom: 0;
      }

      .matchday-controls .matchday-select {
        width: min(100%, 280px);
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-content">
      <div class="brand-line">
        <img
          class="brand-logo"
          src="assets/logo-tasmania.png"
          alt="Logo Tasmania Hackentrick"
          width="84"
          height="84"
        >

        <div>
          <h1>Tasmania Hackentrick</h1>
          <p>Manager- und Tippgemeinschaft</p>
        </div>
      </div>
    </div>
  </header>

  <main>
    <nav
      class="tabs"
      aria-label="Wertung auswählen"
    >
      <button
        id="season-tab"
        class="tab-button active"
        type="button"
      >
        Saison
      </button>

      <button
        id="matchday-tab"
        class="tab-button"
        type="button"
      >
        Spieltag
      </button>
    </nav>

    <div
      id="matchday-controls"
      class="matchday-controls"
      hidden
    >
      <label for="matchday-select">
        Spieltag auswählen
      </label>

      <select
        id="matchday-select"
        class="matchday-select"
        aria-label="Spieltag auswählen"
      ></select>
    </div>

    <section
      id="hero"
      class="hero-card"
      hidden
    >
      <div
        id="hero-label"
        class="hero-label"
      >
        Mann des Tages
      </div>

      <div
        id="hero-value"
        class="hero-value"
      >
        –
      </div>
    </section>

    <div
      id="summary"
      class="summary-grid"
      hidden
    ></div>

    <section class="card ranking-card">
      <div
        id="ranking-heading"
        class="section-heading"
      >
        <div class="season-heading-block">
          <h2 id="ranking-title">
            Gesamtwertung
          </h2>

          <div
            id="season-controls"
            class="season-controls"
          >
            <label for="season-matchday-select">
              Stand nach
            </label>

            <select
              id="season-matchday-select"
              class="season-matchday-select"
              aria-label="Spieltag der Gesamtwertung auswählen"
            ></select>
          </div>
        </div>
      </div>

      <div
        id="loading"
        class="status"
      >
        Ergebnisse werden geladen …
      </div>

      <div
        id="desktop-ranking"
        class="desktop-ranking"
        hidden
      >
        <div class="table-wrapper">
          <table>
            <thead id="ranking-head"></thead>
            <tbody id="ranking-body"></tbody>
          </table>
        </div>
      </div>

      <div
        id="mobile-ranking"
        class="mobile-ranking"
        hidden
      >
        <div
          id="mobile-ranking-list"
          class="ranking-list"
        ></div>
      </div>
    </section>
  </main>

  <footer>
    <div id="footer-status">
      Stand wird geladen …
    </div>

    <button
      id="change-player-button"
      class="change-player-button"
      type="button"
      hidden
    >
      Spieler wechseln
    </button>
  </footer>

  <div
    id="player-dialog-backdrop"
    class="player-dialog-backdrop"
    hidden
  >
    <section
      class="player-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="player-dialog-title"
    >
      <h2 id="player-dialog-title">
        Wer bist du?
      </h2>

      <p>
        Wähle deinen Namen aus. Deine Position wird anschließend
        auf diesem Gerät hervorgehoben.
      </p>

      <select
        id="player-select"
        aria-label="Eigenen Spieler auswählen"
      ></select>

      <div class="dialog-actions">
        <button
          id="cancel-player-button"
          class="dialog-button secondary"
          type="button"
          hidden
        >
          Abbrechen
        </button>

        <button
          id="save-player-button"
          class="dialog-button primary"
          type="button"
        >
          Auswahl speichern
        </button>
      </div>
    </section>
  </div>

  <script>
    const PLAYER_STORAGE_KEY =
      "tasmania-hackentrick-player";

    let appData = null;
    let latestMatchday = null;
    let selectedMatchday = null;
    let selectedSeasonMatchday = null;
    let selectedPlayer = null;
    let activeView = "season";

    const seasonTab =
      document.getElementById("season-tab");

    const matchdayTab =
      document.getElementById("matchday-tab");

    const matchdayControls =
      document.getElementById("matchday-controls");

    const matchdaySelect =
      document.getElementById("matchday-select");

    const seasonMatchdaySelect =
      document.getElementById("season-matchday-select");

    const hero =
      document.getElementById("hero");

    const summary =
      document.getElementById("summary");

    const rankingHeading =
      document.getElementById("ranking-heading");

    const loading =
      document.getElementById("loading");

    const desktopRanking =
      document.getElementById("desktop-ranking");

    const mobileRanking =
      document.getElementById("mobile-ranking");

    const playerDialogBackdrop =
      document.getElementById("player-dialog-backdrop");

    const playerSelect =
      document.getElementById("player-select");

    const savePlayerButton =
      document.getElementById("save-player-button");

    const cancelPlayerButton =
      document.getElementById("cancel-player-button");

    const changePlayerButton =
      document.getElementById("change-player-button");

    seasonTab.addEventListener("click", () => {
      setView("season");
    });

    matchdayTab.addEventListener("click", () => {
      setView("matchday");
    });

    matchdaySelect.addEventListener(
      "change",
      event => {
        selectedMatchday =
          Number(event.target.value);

        renderMatchdayView();
      }
    );

    seasonMatchdaySelect.addEventListener(
      "change",
      event => {
        selectedSeasonMatchday =
          Number(event.target.value);

        renderSeasonView();
      }
    );

    savePlayerButton.addEventListener(
      "click",
      () => {
        const player = playerSelect.value;

        if (!player) {
          return;
        }

        selectedPlayer = player;

        localStorage.setItem(
          PLAYER_STORAGE_KEY,
          selectedPlayer
        );

        closePlayerDialog();
        renderActiveView();
      }
    );

    cancelPlayerButton.addEventListener(
      "click",
      closePlayerDialog
    );

    changePlayerButton.addEventListener(
      "click",
      () => {
        openPlayerDialog(true);
      }
    );

    function setView(view) {
      activeView = view;

      seasonTab.classList.toggle(
        "active",
        view === "season"
      );

      matchdayTab.classList.toggle(
        "active",
        view === "matchday"
      );

      renderActiveView();
    }

    function createSummaryCard(
      label,
      value,
      accent = "navy"
    ) {
      return `
        <article
          class="card summary-card ${accent}-accent"
        >
          <div class="summary-label">
            ${label}
          </div>

          <div class="summary-value">
            ${value}
          </div>
        </article>
      `;
    }

    function getSortedMatchdayNumbers() {
      return appData.matchdays
        .map(item => Number(item.matchday))
        .sort((a, b) => a - b);
    }

    function getLatestMatchday(matchdays) {
      return [...matchdays].sort(
        (a, b) =>
          Number(b.matchday) -
          Number(a.matchday)
      )[0];
    }

    function formatDateOnly(value) {
      if (!value) {
        return "–";
      }

      return new Intl.DateTimeFormat(
        "de-DE",
        {
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        }
      ).format(new Date(value));
    }

    function namesWithMaximum(
      results,
      getValue,
      separator = ", "
    ) {
      const maximum = Math.max(
        ...results.map(getValue)
      );

      return results
        .filter(
          result =>
            getValue(result) === maximum
        )
        .map(result => result.name)
        .join(separator);
    }

    function assignCompetitionRanks(
      rows,
      pointsField
    ) {
      const sorted = [...rows].sort(
        (a, b) => {
          const difference =
            Number(b[pointsField]) -
            Number(a[pointsField]);

          if (difference !== 0) {
            return difference;
          }

          return a.name.localeCompare(
            b.name,
            "de",
            { sensitivity: "base" }
          );
        }
      );

      let previousPoints = null;
      let currentRank = 0;

      return sorted.map(
        (row, index) => {
          const points =
            Number(row[pointsField]);

          if (points !== previousPoints) {
            currentRank = index + 1;
          }

          previousPoints = points;

          return {
            ...row,
            rank: currentRank
          };
        }
      );
    }

    function calculateSeasonRanking(
      data,
      maximumMatchday
    ) {
      const totals = new Map();

      for (const name of data.participants) {
        totals.set(name, {
          name,
          tsPoints: 0,
          msPoints: 0,
          totalPoints: 0,
          matchdayWins: 0
        });
      }

      const relevantMatchdays =
        data.matchdays.filter(
          matchday =>
            Number(matchday.matchday) <=
            Number(maximumMatchday)
        );

      for (const matchday of relevantMatchdays) {
        for (const result of matchday.results) {
          const participant =
            totals.get(result.name);

          if (!participant) {
            continue;
          }

          participant.tsPoints +=
            Number(result.ts.points);

          participant.msPoints +=
            Number(result.ms.points);

          participant.totalPoints +=
            Number(result.matchday_points);

          if (
            Number(result.matchday_rank) === 1
          ) {
            participant.matchdayWins += 1;
          }
        }
      }

      return assignCompetitionRanks(
        [...totals.values()],
        "totalPoints"
      );
    }

    function getPreviousAvailableMatchday(
      selectedNumber
    ) {
      const earlierMatchdays =
        getSortedMatchdayNumbers().filter(
          number =>
            number < Number(selectedNumber)
        );

      if (earlierMatchdays.length === 0) {
        return null;
      }

      return earlierMatchdays[
        earlierMatchdays.length - 1
      ];
    }

    function getSeasonRankingWithTrend(
      selectedNumber
    ) {
      const currentRanking =
        calculateSeasonRanking(
          appData,
          selectedNumber
        );

      const previousNumber =
        getPreviousAvailableMatchday(
          selectedNumber
        );

      if (previousNumber === null) {
        return currentRanking.map(result => ({
          ...result,
          trend: 0
        }));
      }

      const previousRanking =
        calculateSeasonRanking(
          appData,
          previousNumber
        );

      const previousRanks = new Map(
        previousRanking.map(result => [
          result.name,
          result.rank
        ])
      );

      return currentRanking.map(result => ({
        ...result,
        trend:
          Number(previousRanks.get(result.name)) -
          Number(result.rank)
      }));
    }

    function populateMatchdaySelect() {
      const sortedMatchdays =
        [...appData.matchdays].sort(
          (a, b) =>
            Number(b.matchday) -
            Number(a.matchday)
        );

      const options = sortedMatchdays
        .map(
          matchday => `
            <option value="${matchday.matchday}">
              Spieltag ${matchday.matchday}
            </option>
          `
        )
        .join("");

      matchdaySelect.innerHTML = options;
      seasonMatchdaySelect.innerHTML = options;

      matchdaySelect.value =
        String(selectedMatchday);

      seasonMatchdaySelect.value =
        String(selectedSeasonMatchday);
    }

    function populatePlayerSelect() {
      playerSelect.innerHTML = `
        <option value="">
          Bitte auswählen
        </option>
        ${appData.participants
          .map(
            name => `
              <option value="${name}">
                ${name}
              </option>
            `
          )
          .join("")}
      `;

      if (selectedPlayer) {
        playerSelect.value = selectedPlayer;
      }
    }

    function openPlayerDialog(canCancel) {
      populatePlayerSelect();

      cancelPlayerButton.hidden = !canCancel;
      playerDialogBackdrop.hidden = false;

      window.setTimeout(() => {
        playerSelect.focus();
      }, 0);
    }

    function closePlayerDialog() {
      playerDialogBackdrop.hidden = true;
    }

    function getRankClass(rank) {
      const numericRank = Number(rank);

      if (numericRank === 1) {
        return "rank-1";
      }

      if (numericRank === 2) {
        return "rank-2";
      }

      if (numericRank === 3) {
        return "rank-3";
      }

      return "";
    }

    function getPodiumRowClass(rank) {
      const numericRank = Number(rank);

      if (
        numericRank >= 1 &&
        numericRank <= 3
      ) {
        return `podium-${numericRank}`;
      }

      return "";
    }

    function getTrendMarkup(trend) {
      if (trend > 0) {
        return `
          <span class="trend trend-up">
            ▲ ${trend}
          </span>
        `;
      }

      if (trend < 0) {
        return `
          <span class="trend trend-down">
            ▼ ${Math.abs(trend)}
          </span>
        `;
      }

      return `
        <span class="trend trend-same">
          –
        </span>
      `;
    }

    function getYouBadge(name) {
      return name === selectedPlayer
        ? `<span class="you-badge">Du</span>`
        : "";
    }

    function isSelectedPlayer(name) {
      return name === selectedPlayer;
    }

    function renderActiveView() {
      if (!appData || !latestMatchday) {
        return;
      }

      if (activeView === "season") {
        renderSeasonView();
      } else {
        renderMatchdayView();
      }
    }

    function renderSeasonView() {
      matchdayControls.hidden = true;
      hero.hidden = true;
      summary.hidden = true;
      rankingHeading.hidden = false;

      seasonMatchdaySelect.value =
        String(selectedSeasonMatchday);

      const ranking =
        getSeasonRankingWithTrend(
          selectedSeasonMatchday
        );

      document.getElementById(
        "ranking-title"
      ).textContent = "Gesamtwertung";

      document.getElementById(
        "ranking-head"
      ).innerHTML = `
        <tr>
          <th>Rang</th>
          <th>Spieler</th>
          <th>TS</th>
          <th>MS</th>
          <th>Gesamt</th>
          <th>Tagessiege</th>
          <th>Trend</th>
        </tr>
      `;

      document.getElementById(
        "ranking-body"
      ).innerHTML =
        ranking
          .map(result => {
            const rankClass =
              getRankClass(result.rank);

            const rowClasses = [
              getPodiumRowClass(result.rank),
              isSelectedPlayer(result.name)
                ? "is-me"
                : ""
            ]
              .filter(Boolean)
              .join(" ");

            return `
              <tr class="${rowClasses}">
                <td>
                  <span
                    class="rank-badge ${rankClass}"
                  >
                    ${result.rank}
                  </span>
                </td>

                <td class="player">
                  ${result.name}
                  ${getYouBadge(result.name)}
                </td>

                <td class="ts-value">
                  ${result.tsPoints}
                </td>

                <td class="ms-value">
                  ${result.msPoints}
                </td>

                <td class="total">
                  ${result.totalPoints}
                </td>

                <td>
                  ${result.matchdayWins}
                </td>

                <td>
                  ${getTrendMarkup(result.trend)}
                </td>
              </tr>
            `;
          })
          .join("");

      document.getElementById(
        "mobile-ranking-list"
      ).innerHTML =
        ranking
          .map(result => {
            const rankClass =
              getRankClass(result.rank);

            const selectedClass =
              isSelectedPlayer(result.name)
                ? "is-me"
                : "";

            return `
              <article
                class="
                  ranking-item
                  place-${result.rank}
                  ${selectedClass}
                "
              >
                <span
                  class="rank-badge ${rankClass}"
                >
                  ${result.rank}
                </span>

                <div class="mobile-player">
                  <div class="mobile-player-name">
                    ${result.name}
                    ${getYouBadge(result.name)}
                  </div>

                  <div class="mobile-details">
                    <span class="points-badge ts">
                      TS ${result.tsPoints}
                    </span>

                    <span class="points-badge ms">
                      MS ${result.msPoints}
                    </span>

                    <span>
                      ${result.matchdayWins}
                      Tagessieg${
                        result.matchdayWins === 1
                          ? ""
                          : "e"
                      }
                    </span>
                  </div>
                </div>

                <div class="mobile-total">
                  ${result.totalPoints}

                  <span class="mobile-total-label">
                    Punkte
                  </span>

                  <div class="mobile-trend">
                    ${getTrendMarkup(result.trend)}
                  </div>
                </div>
              </article>
            `;
          })
          .join("");
    }

    function renderMatchdayView() {
      matchdayControls.hidden = false;
      hero.hidden = false;
      summary.hidden = false;
      rankingHeading.hidden = true;

      const matchday =
        appData.matchdays.find(
          item =>
            Number(item.matchday) ===
            Number(selectedMatchday)
        );

      if (!matchday) {
        return;
      }

      matchdaySelect.value =
        String(matchday.matchday);

      const results =
        [...matchday.results].sort(
          (a, b) => {
            const rankDifference =
              Number(a.matchday_rank) -
              Number(b.matchday_rank);

            if (rankDifference !== 0) {
              return rankDifference;
            }

            return a.name.localeCompare(
              b.name,
              "de",
              { sensitivity: "base" }
            );
          }
        );

      const winnerNames =
        namesWithMaximum(
          results,
          result =>
            result.matchday_points,
          " & "
        );

      const bestTs =
        namesWithMaximum(
          results,
          result =>
            result.ts.points,
          " & "
        );

      const bestMs =
        namesWithMaximum(
          results,
          result =>
            result.ms.points,
          " & "
        );

      document.getElementById(
        "hero-label"
      ).textContent = "Mann des Tages";

      document.getElementById(
        "hero-value"
      ).textContent = winnerNames;

      summary.innerHTML = [
        createSummaryCard(
          "Bestes Tippspiel",
          bestTs,
          "red"
        ),
        createSummaryCard(
          "Bestes Managerspiel",
          bestMs,
          "navy"
        )
      ].join("");

      document.getElementById(
        "ranking-head"
      ).innerHTML = `
        <tr>
          <th>Rang</th>
          <th>Spieler</th>
          <th>TS</th>
          <th>MS</th>
          <th>Gesamt</th>
          <th>Rohpunkte</th>
        </tr>
      `;

      document.getElementById(
        "ranking-body"
      ).innerHTML =
        results
          .map(result => {
            const rankClass =
              getRankClass(
                result.matchday_rank
              );

            const rowClasses = [
              getPodiumRowClass(
                result.matchday_rank
              ),
              isSelectedPlayer(result.name)
                ? "is-me"
                : ""
            ]
              .filter(Boolean)
              .join(" ");

            return `
              <tr class="${rowClasses}">
                <td>
                  <span
                    class="rank-badge ${rankClass}"
                  >
                    ${result.matchday_rank}
                  </span>
                </td>

                <td class="player">
                  ${result.name}
                  ${getYouBadge(result.name)}
                </td>

                <td class="ts-value">
                  ${result.ts.points}
                </td>

                <td class="ms-value">
                  ${result.ms.points}
                </td>

                <td class="total">
                  ${result.matchday_points}
                </td>

                <td class="raw">
                  TS ${result.ts.raw_points}
                  ·
                  MS ${result.ms.raw_points}
                </td>
              </tr>
            `;
          })
          .join("");

      document.getElementById(
        "mobile-ranking-list"
      ).innerHTML =
        results
          .map(result => {
            const rankClass =
              getRankClass(
                result.matchday_rank
              );

            const selectedClass =
              isSelectedPlayer(result.name)
                ? "is-me"
                : "";

            return `
              <article
                class="
                  ranking-item
                  place-${result.matchday_rank}
                  ${selectedClass}
                "
              >
                <span
                  class="rank-badge ${rankClass}"
                >
                  ${result.matchday_rank}
                </span>

                <div class="mobile-player">
                  <div class="mobile-player-name">
                    ${result.name}
                    ${getYouBadge(result.name)}
                  </div>

                  <div class="mobile-details">
                    <span class="points-badge ts">
                      TS ${result.ts.points}
                    </span>

                    <span class="points-badge ms">
                      MS ${result.ms.points}
                    </span>

                    <span>
                      Roh:
                      ${result.ts.raw_points}
                      /
                      ${result.ms.raw_points}
                    </span>
                  </div>
                </div>

                <div class="mobile-total">
                  ${result.matchday_points}

                  <span class="mobile-total-label">
                    Punkte
                  </span>
                </div>
              </article>
            `;
          })
          .join("");
    }

    async function loadData() {
      try {
        const response = await fetch(
          `data.json?timestamp=${Date.now()}`,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "data.json konnte nicht geladen werden: " +
            response.status
          );
        }

        appData = await response.json();

        if (
          !Array.isArray(appData.matchdays) ||
          appData.matchdays.length === 0
        ) {
          throw new Error(
            "Es sind noch keine Spieltage gespeichert."
          );
        }

        if (
          !Array.isArray(appData.participants) ||
          appData.participants.length !== 9
        ) {
          throw new Error(
            "Die Teilnehmerliste ist nicht vollständig."
          );
        }

        latestMatchday =
          getLatestMatchday(
            appData.matchdays
          );

        if (
          !Array.isArray(
            latestMatchday.results
          ) ||
          latestMatchday.results.length !== 9
        ) {
          throw new Error(
            "Die Spieltagsdaten sind nicht vollständig."
          );
        }

        selectedMatchday =
          Number(latestMatchday.matchday);

        selectedSeasonMatchday =
          Number(latestMatchday.matchday);

        const storedPlayer =
          localStorage.getItem(
            PLAYER_STORAGE_KEY
          );

        if (
          storedPlayer &&
          appData.participants.includes(
            storedPlayer
          )
        ) {
          selectedPlayer = storedPlayer;
        }

        populateMatchdaySelect();
        renderActiveView();

        loading.hidden = true;
        desktopRanking.hidden = false;
        mobileRanking.hidden = false;

        document.getElementById(
          "footer-status"
        ).textContent =
          `Stand: ${latestMatchday.matchday}. Spieltag` +
          ` · ${formatDateOnly(appData.updated_at)}`;

        changePlayerButton.hidden = false;

        if (!selectedPlayer) {
          openPlayerDialog(false);
        }
      } catch (error) {
        console.error(error);

        loading.classList.add("error");

        loading.textContent =
          `Fehler beim Laden: ${error.message}`;
      }
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register(
          "service-worker.js",
          {
            updateViaCache: "none"
          }
        )
        .then(
          registration =>
            registration.update()
        )
        .catch(error => {
          console.error(
            "Service Worker konnte nicht registriert werden:",
            error
          );
        });
    }

    loadData();
  </script>
</body>
</html>
