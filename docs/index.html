<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#0d5132">

  <title>Tasmania Hackentrick</title>

  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --background: #f3f5f7;
      --surface: #ffffff;
      --text: #17202a;
      --muted: #68737d;
      --border: #dde2e7;
      --primary: #136f45;
      --primary-dark: #0d5132;
      --primary-light: #eaf5ef;
      --gold: #d59b22;
      --danger: #a32121;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    header {
      padding: 24px 16px 28px;
      background:
        linear-gradient(
          135deg,
          var(--primary-dark),
          var(--primary)
        );
      color: white;
    }

    .header-content,
    main {
      width: min(100%, 900px);
      margin: 0 auto;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.7rem, 7vw, 2.7rem);
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.85;
    }

    main {
      padding: 18px 12px 40px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 18px;
      padding: 5px;
      background: #e3e7ea;
      border-radius: 14px;
    }

    .tab-button {
      min-height: 46px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-button.active {
      background: var(--surface);
      color: var(--primary-dark);
      box-shadow: 0 2px 8px rgb(0 0 0 / 8%);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 4px 18px rgb(0 0 0 / 6%);
    }

    .summary-card {
      min-width: 0;
      padding: 16px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .summary-value {
      margin-top: 6px;
      overflow-wrap: anywhere;
      font-size: 1.35rem;
      font-weight: 750;
    }

    .ranking-card {
      overflow: hidden;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 16px 12px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 1.25rem;
    }

    .ranking-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ranking-controls span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .matchday-select {
      min-height: 38px;
      padding: 6px 34px 6px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 570px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 12px;
      border-top: 1px solid var(--border);
      text-align: center;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    tbody tr:first-child {
      background: #fff8e5;
    }

    .rank {
      font-weight: 750;
    }

    .rank-1 {
      color: var(--gold);
    }

    .player {
      font-weight: 700;
    }

    .raw {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .total {
      color: var(--primary-dark);
      font-size: 1.05rem;
      font-weight: 800;
    }

    .status {
      padding: 20px;
      text-align: center;
      color: var(--muted);
    }

    .error {
      color: var(--danger);
    }

    [hidden] {
      display: none !important;
    }

    footer {
      padding: 24px 12px;
      color: var(--muted);
      font-size: 0.8rem;
      text-align: center;
    }

    @media (max-width: 520px) {
      .section-heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .ranking-controls {
        width: 100%;
      }

      .matchday-select {
        width: 100%;
      }
    }

    @media (min-width: 650px) {
      .summary-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      main {
        padding-top: 24px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-content">
      <h1>Tasmania Hackentrick</h1>
      <p>Tippspiel und Managerspiel in einer Wertung</p>
    </div>
  </header>

  <main>
    <nav class="tabs" aria-label="Wertung auswählen">
      <button
        id="season-tab"
        class="tab-button active"
        type="button"
      >
        Saison
      </button>

      <button
        id="matchday-tab"
        class="tab-button"
        type="button"
      >
        Spieltag
      </button>
    </nav>

    <div id="summary" class="summary-grid"></div>

    <section class="card ranking-card">
      <div class="section-heading">
        <h2 id="ranking-title">Saisonwertung</h2>

        <div class="ranking-controls">
          <span id="ranking-label"></span>

          <select
            id="matchday-select"
            class="matchday-select"
            aria-label="Spieltag auswählen"
            hidden
          ></select>
        </div>
      </div>

      <div id="loading" class="status">
        Ergebnisse werden geladen …
      </div>

      <div
        id="table-wrapper"
        class="table-wrapper"
        hidden
      >
        <table>
          <thead id="ranking-head"></thead>
          <tbody id="ranking-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer id="footer">
    Tasmania Hackentrick · Automatisch ausgewertet
  </footer>

  <script>
    let appData = null;
    let latestMatchday = null;
    let selectedMatchday = null;
    let activeView = "season";

    const seasonTab =
      document.getElementById("season-tab");

    const matchdayTab =
      document.getElementById("matchday-tab");

    const matchdaySelect =
      document.getElementById("matchday-select");

    seasonTab.addEventListener("click", () => {
      setView("season");
    });

    matchdayTab.addEventListener("click", () => {
      setView("matchday");
    });

    matchdaySelect.addEventListener("change", event => {
      selectedMatchday = Number(event.target.value);
      renderMatchdayView();
    });

    function setView(view) {
      activeView = view;

      seasonTab.classList.toggle(
        "active",
        view === "season"
      );

      matchdayTab.classList.toggle(
        "active",
        view === "matchday"
      );

      renderActiveView();
    }

    function createSummaryCard(label, value) {
      return `
        <article class="card summary-card">
          <div class="summary-label">${label}</div>
          <div class="summary-value">${value}</div>
        </article>
      `;
    }

    function getLatestMatchday(matchdays) {
      return [...matchdays].sort(
        (a, b) =>
          Number(b.matchday) - Number(a.matchday)
      )[0];
    }

    function formatDate(value) {
      if (!value) {
        return "–";
      }

      return new Intl.DateTimeFormat("de-DE", {
        dateStyle: "short",
        timeStyle: "short"
      }).format(new Date(value));
    }

    function namesWithMaximum(results, getValue) {
      const maximum = Math.max(
        ...results.map(getValue)
      );

      return results
        .filter(result => getValue(result) === maximum)
        .map(result => result.name)
        .join(", ");
    }

    function assignCompetitionRanks(
      rows,
      pointsField
    ) {
      const sorted = [...rows].sort((a, b) => {
        const difference =
          Number(b[pointsField]) -
          Number(a[pointsField]);

        if (difference !== 0) {
          return difference;
        }

        return a.name.localeCompare(
          b.name,
          "de",
          { sensitivity: "base" }
        );
      });

      let previousPoints = null;
      let currentRank = 0;

      return sorted.map((row, index) => {
        const points = Number(row[pointsField]);

        if (points !== previousPoints) {
          currentRank = index + 1;
        }

        previousPoints = points;

        return {
          ...row,
          rank: currentRank
        };
      });
    }

    function calculateSeasonRanking(data) {
      const totals = new Map();

      for (const name of data.participants) {
        totals.set(name, {
          name,
          tsPoints: 0,
          msPoints: 0,
          totalPoints: 0,
          matchdayWins: 0
        });
      }

      for (const matchday of data.matchdays) {
        for (const result of matchday.results) {
          const participant = totals.get(result.name);

          if (!participant) {
            continue;
          }

          participant.tsPoints += Number(
            result.ts.points
          );

          participant.msPoints += Number(
            result.ms.points
          );

          participant.totalPoints += Number(
            result.matchday_points
          );

          if (Number(result.matchday_rank) === 1) {
            participant.matchdayWins += 1;
          }
        }
      }

      return assignCompetitionRanks(
        [...totals.values()],
        "totalPoints"
      );
    }

    function populateMatchdaySelect() {
      const sortedMatchdays =
        [...appData.matchdays].sort(
          (a, b) =>
            Number(b.matchday) - Number(a.matchday)
        );

      matchdaySelect.innerHTML = sortedMatchdays
        .map(matchday => `
          <option value="${matchday.matchday}">
            Spieltag ${matchday.matchday}
          </option>
        `)
        .join("");

      matchdaySelect.value =
        String(selectedMatchday);
    }

    function renderActiveView() {
      if (!appData || !latestMatchday) {
        return;
      }

      if (activeView === "season") {
        renderSeasonView();
      } else {
        renderMatchdayView();
      }
    }

    function renderSeasonView() {
      matchdaySelect.hidden = true;

      const rankingLabel =
        document.getElementById("ranking-label");

      rankingLabel.hidden = false;

      const ranking = calculateSeasonRanking(appData);

      const leaderNames = namesWithMaximum(
        ranking,
        result => result.totalPoints
      );

      const bestTs = namesWithMaximum(
        ranking,
        result => result.tsPoints
      );

      const bestMs = namesWithMaximum(
        ranking,
        result => result.msPoints
      );

      document.getElementById("summary").innerHTML = [
        createSummaryCard(
          "Spieltage",
          appData.matchdays.length
        ),
        createSummaryCard(
          "Tabellenführer",
          leaderNames
        ),
        createSummaryCard(
          "Bestes TS",
          bestTs
        ),
        createSummaryCard(
          "Bestes MS",
          bestMs
        )
      ].join("");

      document.getElementById(
        "ranking-title"
      ).textContent = "Saisonwertung";

      rankingLabel.textContent =
        `${appData.matchdays.length} Spieltag` +
        `${appData.matchdays.length === 1 ? "" : "e"}`;

      document.getElementById(
        "ranking-head"
      ).innerHTML = `
        <tr>
          <th>Rang</th>
          <th>Spieler</th>
          <th>TS</th>
          <th>MS</th>
          <th>Gesamt</th>
          <th>Tagessiege</th>
        </tr>
      `;

      document.getElementById(
        "ranking-body"
      ).innerHTML = ranking.map(result => {
        const rankClass =
          result.rank === 1
            ? "rank rank-1"
            : "rank";

        return `
          <tr>
            <td class="${rankClass}">
              ${result.rank}
            </td>

            <td class="player">
              ${result.name}
            </td>

            <td>${result.tsPoints}</td>
            <td>${result.msPoints}</td>

            <td class="total">
              ${result.totalPoints}
            </td>

            <td>${result.matchdayWins}</td>
          </tr>
        `;
      }).join("");
    }

    function renderMatchdayView() {
      const matchday = appData.matchdays.find(
        item =>
          Number(item.matchday) ===
          Number(selectedMatchday)
      );

      if (!matchday) {
        return;
      }

      const results = matchday.results;

      const winnerNames = namesWithMaximum(
        results,
        result => result.matchday_points
      );

      const bestTs = namesWithMaximum(
        results,
        result => result.ts.points
      );

      const bestMs = namesWithMaximum(
        results,
        result => result.ms.points
      );

      document.getElementById("summary").innerHTML = [
        createSummaryCard(
          "Spieltag",
          matchday.matchday
        ),
        createSummaryCard(
          "Tagessieger",
          winnerNames
        ),
        createSummaryCard(
          "Bestes TS",
          bestTs
        ),
        createSummaryCard(
          "Bestes MS",
          bestMs
        )
      ].join("");

      document.getElementById(
        "ranking-title"
      ).textContent = "Spieltagswertung";

      document.getElementById(
        "ranking-label"
      ).hidden = true;

      matchdaySelect.hidden = false;
      matchdaySelect.value =
        String(matchday.matchday);

      document.getElementById(
        "ranking-head"
      ).innerHTML = `
        <tr>
          <th>Rang</th>
          <th>Spieler</th>
          <th>TS</th>
          <th>MS</th>
          <th>Gesamt</th>
          <th>Rohpunkte</th>
        </tr>
      `;

      document.getElementById(
        "ranking-body"
      ).innerHTML = results.map(result => {
        const rankClass =
          Number(result.matchday_rank) === 1
            ? "rank rank-1"
            : "rank";

        return `
          <tr>
            <td class="${rankClass}">
              ${result.matchday_rank}
            </td>

            <td class="player">
              ${result.name}
            </td>

            <td>
              <strong>${result.ts.points}</strong>
            </td>

            <td>
              <strong>${result.ms.points}</strong>
            </td>

            <td class="total">
              ${result.matchday_points}
            </td>

            <td class="raw">
              TS ${result.ts.raw_points}
              ·
              MS ${result.ms.raw_points}
            </td>
          </tr>
        `;
      }).join("");
    }

    async function loadData() {
      const loading =
        document.getElementById("loading");

      const tableWrapper =
        document.getElementById("table-wrapper");

      try {
        const response = await fetch(
          `data.json?timestamp=${Date.now()}`,
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error(
            "data.json konnte nicht geladen werden: " +
            response.status
          );
        }

        appData = await response.json();

        if (
          !Array.isArray(appData.matchdays) ||
          appData.matchdays.length === 0
        ) {
          throw new Error(
            "Es sind noch keine Spieltage gespeichert."
          );
        }

        if (
          !Array.isArray(appData.participants) ||
          appData.participants.length !== 9
        ) {
          throw new Error(
            "Die Teilnehmerliste ist nicht vollständig."
          );
        }

        latestMatchday = getLatestMatchday(
          appData.matchdays
        );

        if (
          !Array.isArray(latestMatchday.results) ||
          latestMatchday.results.length !== 9
        ) {
          throw new Error(
            "Die Spieltagsdaten sind nicht vollständig."
          );
        }

        selectedMatchday =
          Number(latestMatchday.matchday);

        populateMatchdaySelect();
        renderActiveView();

        loading.hidden = true;
        tableWrapper.hidden = false;

        document.getElementById(
          "footer"
        ).textContent =
          "Tasmania Hackentrick · Aktualisiert " +
          formatDate(appData.updated_at);
      } catch (error) {
        console.error(error);

        loading.classList.add("error");
        loading.textContent =
          `Fehler beim Laden: ${error.message}`;
      }
    }

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register(
        "service-worker.js"
      );
    }

    loadData();
  </script>
</body>
</html>
