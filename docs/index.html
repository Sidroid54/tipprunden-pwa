<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#ffffff">

  <title>Tasmania Hackentrick</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="assets/icon-tasmania-192.png"
  >

  <link
    rel="apple-touch-icon"
    href="assets/icon-tasmania-192.png"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <div class="header-content">
      <div class="brand-line">
        <img
          class="brand-logo"
          src="assets/logo-tasmania.png"
          alt="Logo Tasmania Hackentrick"
          width="84"
          height="84"
        >

        <div>
          <h1>Tasmania Hackentrick</h1>
          <p>Manager- und Tippgemeinschaft</p>
        </div>
      </div>
    </div>
  </header>

  <main>
    <nav
      class="tabs"
      aria-label="Wertung auswählen"
    >
      <button
        id="season-tab"
        class="tab-button active"
        type="button"
      >
        Saison
      </button>

      <button
        id="matchday-tab"
        class="tab-button"
        type="button"
      >
        Spieltag
      </button>
    </nav>

    <div
      id="matchday-controls"
      class="matchday-controls"
      hidden
    >
      <label for="matchday-select">
        Spieltag auswählen
      </label>

      <select
        id="matchday-select"
        class="matchday-select"
        aria-label="Spieltag auswählen"
      ></select>
    </div>

    <nav
      id="matchday-mode-tabs"
      class="matchday-mode-tabs"
      aria-label="Spieltagswertung auswählen"
      hidden
    >
      <button
        class="matchday-mode-button active"
        type="button"
        data-matchday-mode="combined"
        aria-pressed="true"
      >
        Gesamt
      </button>

      <button
        class="matchday-mode-button"
        type="button"
        data-matchday-mode="tips"
        aria-pressed="false"
      >
        Tippspiel
      </button>

      <button
        class="matchday-mode-button"
        type="button"
        data-matchday-mode="manager"
        aria-pressed="false"
      >
        Managerspiel
      </button>
    </nav>

    <section
      id="hero"
      class="hero-card"
      hidden
    >
      <div
        id="hero-label"
        class="hero-label"
      >
        Mann des Tages
      </div>

      <div
        id="hero-value"
        class="hero-value"
      >
        –
      </div>
    </section>

    <div
      id="summary"
      class="summary-grid"
      hidden
    ></div>

    <section class="card ranking-card">
      <div
        id="ranking-heading"
        class="section-heading"
      >
        <div class="season-heading-block">
          <h2 id="ranking-title">
            Gesamtwertung
          </h2>

          <div
            id="season-controls"
            class="season-controls"
          >
            <label for="season-matchday-select">
              Stand nach
            </label>

            <select
              id="season-matchday-select"
              class="season-matchday-select"
              aria-label="Spieltag der Gesamtwertung auswählen"
            ></select>
          </div>
        </div>
      </div>

      <div
        id="loading"
        class="status"
      >
        Ergebnisse werden geladen …
      </div>

      <div
        id="desktop-ranking"
        class="desktop-ranking"
        hidden
      >
        <div class="table-wrapper">
          <table>
            <thead id="ranking-head"></thead>
            <tbody id="ranking-body"></tbody>
          </table>
        </div>
      </div>

      <div
        id="mobile-ranking"
        class="mobile-ranking"
        hidden
      >
        <div
          id="mobile-ranking-list"
          class="ranking-list"
        ></div>
      </div>
    </section>
  </main>

  <footer>
    <div id="footer-status">
      Stand wird geladen …
    </div>

    <button
      id="change-player-button"
      class="change-player-button"
      type="button"
      hidden
    >
      Spieler wechseln
    </button>
  </footer>

  <div
    id="player-dialog-backdrop"
    class="player-dialog-backdrop"
    hidden
  >
    <section
      class="player-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="player-dialog-title"
    >
      <h2 id="player-dialog-title">
        Wer bist du?
      </h2>

      <p>
        Wähle deinen Namen aus. Deine Position wird anschließend
        auf diesem Gerät hervorgehoben.
      </p>

      <select
        id="player-select"
        aria-label="Eigenen Spieler auswählen"
      ></select>

      <div class="dialog-actions">
        <button
          id="cancel-player-button"
          class="dialog-button secondary"
          type="button"
          hidden
        >
          Abbrechen
        </button>

        <button
          id="save-player-button"
          class="dialog-button primary"
          type="button"
        >
          Auswahl speichern
        </button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
