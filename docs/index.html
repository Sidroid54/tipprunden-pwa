<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#ffffff">

  <title>Tasmania Hackentrick</title>

  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --navy: #0b1f3a;
      --navy-light: #17365f;
      --navy-soft: #e9eef5;

      --red: #c81d25;
      --red-dark: #98151b;
      --red-soft: #fdecee;

      --white: #ffffff;
      --background: #f3f5f8;
      --surface: #ffffff;

      --text: #172033;
      --muted: #6b7480;
      --border: #dce1e8;

      --gold: #d39b28;
      --gold-soft: #fff7df;

      --silver: #8b96a3;
      --silver-soft: #f1f3f5;

      --bronze: #a66a3f;
      --bronze-soft: #f8eee7;

      --shadow:
        0 8px 24px rgb(11 31 58 / 8%);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    select {
      font: inherit;
    }

    header {
      position: relative;
      overflow: hidden;
      padding: 24px 16px 28px;
      border-bottom: 4px solid var(--red);
      background:
        linear-gradient(
          135deg,
          #ffffff,
          #f1f3f6
        );
      color: var(--navy);
    }

    header::after {
      content: "";
      position: absolute;
      right: -80px;
      bottom: -120px;
      width: 240px;
      height: 240px;
      border: 34px solid rgb(11 31 58 / 4%);
      border-radius: 50%;
      pointer-events: none;
    }

    .header-content,
    main {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    .brand-line {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-logo {
      display: block;
      width: 86px;
      height: 86px;
      flex: 0 0 auto;
      border-radius: 50%;
      object-fit: contain;
      filter:
        drop-shadow(
          0 5px 10px rgb(11 31 58 / 18%)
        );
    }

    header h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(1.65rem, 7vw, 2.8rem);
      line-height: 1.05;
    }

    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .red-line {
      position: relative;
      z-index: 1;
      width: 72px;
      height: 4px;
      margin-top: 18px;
      border-radius: 999px;
      background: var(--red);
    }

    main {
      padding: 18px 12px 44px;
    }

    .tabs {
      position: sticky;
      z-index: 10;
      top: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 18px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgb(243 245 248 / 94%);
      box-shadow:
        0 6px 20px rgb(11 31 58 / 8%);
      backdrop-filter: blur(12px);
    }

    .tab-button {
      min-height: 48px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--navy);
      font-weight: 800;
      cursor: pointer;
    }

    .tab-button.active {
      background: var(--red);
      color: var(--white);
      box-shadow:
        0 4px 12px rgb(200 29 37 / 25%);
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      margin-bottom: 14px;
      padding: 20px;
      border-radius: 20px;
      background:
        linear-gradient(
          135deg,
          var(--navy),
          var(--navy-light)
        );
      color: var(--white);
      box-shadow: var(--shadow);
    }

    .hero-card::after {
      content: "";
      position: absolute;
      right: -35px;
      bottom: -52px;
      width: 150px;
      height: 150px;
      border: 25px solid rgb(255 255 255 / 7%);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-card::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 6px;
      background: var(--red);
    }

    .hero-label {
      position: relative;
      z-index: 1;
      color: rgb(255 255 255 / 72%);
      font-size: 0.74rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .hero-value {
      position: relative;
      z-index: 1;
      margin-top: 6px;
      overflow-wrap: anywhere;
      font-size: clamp(1.65rem, 8vw, 2.5rem);
      font-weight: 900;
      line-height: 1.1;
    }

    .hero-detail {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      color: rgb(255 255 255 / 75%);
      font-size: 0.9rem;
    }

    .summary-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .summary-card {
      min-width: 0;
      padding: 15px;
    }

    .summary-label {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .summary-value {
      margin-top: 6px;
      overflow-wrap: anywhere;
      color: var(--navy);
      font-size: 1.2rem;
      font-weight: 850;
    }

    .summary-card.red-accent {
      border-top: 4px solid var(--red);
    }

    .summary-card.navy-accent {
      border-top: 4px solid var(--navy);
    }

    .ranking-card {
      overflow: hidden;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 18px 16px 14px;
    }

    .section-heading h2 {
      margin: 0;
      color: var(--navy);
      font-size: 1.22rem;
    }

    .ranking-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .ranking-controls span {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 650;
    }

    .matchday-select {
      min-height: 42px;
      padding: 7px 34px 7px 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      background: var(--white);
      color: var(--navy);
      font-weight: 800;
      cursor: pointer;
    }

    .matchday-select:focus {
      border-color: var(--red);
      box-shadow:
        0 0 0 3px rgb(200 29 37 / 13%);
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 650px;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 14px 12px;
      border-top: 1px solid var(--border);
      text-align: center;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      background: #f8f9fb;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    tbody tr:hover {
      background: #f8f9fb;
    }

    .rank-badge {
      display: inline-grid;
      width: 32px;
      height: 32px;
      place-items: center;
      border-radius: 50%;
      background: var(--navy-soft);
      color: var(--navy);
      font-size: 0.88rem;
      font-weight: 900;
    }

    .rank-badge.rank-1 {
      background: var(--gold-soft);
      color: var(--gold);
    }

    .rank-badge.rank-2 {
      background: var(--silver-soft);
      color: var(--silver);
    }

    .rank-badge.rank-3 {
      background: var(--bronze-soft);
      color: var(--bronze);
    }

    .player {
      color: var(--navy);
      font-weight: 800;
    }

    .total {
      color: var(--red-dark);
      font-size: 1.05rem;
      font-weight: 900;
    }

    .raw {
      color: var(--muted);
      font-size: 0.82rem;
    }

    .desktop-ranking {
      display: block;
    }

    .mobile-ranking {
      display: none;
      padding: 0 12px 14px;
    }

    .ranking-list {
      display: grid;
      gap: 10px;
    }

    .ranking-item {
      position: relative;
      display: grid;
      grid-template-columns:
        42px minmax(0, 1fr) auto;
      gap: 11px;
      align-items: center;
      overflow: hidden;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--white);
    }

    .ranking-item.place-1 {
      border-color:
        rgb(211 155 40 / 48%);
      background:
        linear-gradient(
          90deg,
          var(--gold-soft),
          var(--white) 48%
        );
    }

    .ranking-item::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 4px;
      background: var(--navy);
    }

    .ranking-item.place-1::before {
      background: var(--gold);
    }

    .ranking-item.place-2::before {
      background: var(--silver);
    }

    .ranking-item.place-3::before {
      background: var(--bronze);
    }

    .mobile-player {
      min-width: 0;
    }

    .mobile-player-name {
      overflow: hidden;
      color: var(--navy);
      font-weight: 850;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mobile-details {
      display: flex;
      flex-wrap: wrap;
      gap: 5px 8px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .points-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 7px;
      border-radius: 999px;
      background: var(--navy-soft);
      color: var(--navy);
      font-weight: 750;
    }

    .points-badge.red {
      background: var(--red-soft);
      color: var(--red-dark);
    }

    .mobile-total {
      min-width: 48px;
      color: var(--red-dark);
      font-size: 1.22rem;
      font-weight: 950;
      text-align: right;
    }

    .mobile-total-label {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .status {
      padding: 22px;
      color: var(--muted);
      text-align: center;
    }

    .error {
      color: var(--red-dark);
    }

    [hidden] {
      display: none !important;
    }

    footer {
      padding: 24px 12px;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    @media (max-width: 650px) {
      header {
        padding-top: 18px;
        padding-bottom: 22px;
      }

      .brand-line {
        gap: 11px;
      }

      .brand-logo {
        width: 70px;
        height: 70px;
      }

      header p {
        font-size: 0.84rem;
      }

      main {
        padding-right: 10px;
        padding-left: 10px;
      }

      .section-heading {
        align-items: stretch;
        flex-direction: column;
      }

      .ranking-controls {
        width: 100%;
      }

      .matchday-select {
        width: 100%;
      }

      .desktop-ranking {
        display: none;
      }

      .mobile-ranking {
        display: block;
      }

      .ranking-card {
        overflow: visible;
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      .ranking-card > .section-heading {
        margin-bottom: 10px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: var(--white);
        box-shadow: var(--shadow);
      }
    }

    @media (min-width: 720px) {
      main {
        padding-top: 24px;
      }

      .summary-grid {
        gap: 14px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-content">
      <div class="brand-line">
        <img
          class="brand-logo"
          src="assets/logo-tasmania.png"
          alt="Logo Tasmania Hackentrick"
          width="86"
          height="86"
        >

        <div>
          <h1>Tasmania Hackentrick</h1>

          <p>
            Manager- und Tippgemeinschaft
          </p>
        </div>
      </div>

      <div class="red-line"></div>
    </div>
  </header>

  <main>
    <nav
      class="tabs"
      aria-label="Wertung auswählen"
    >
      <button
        id="season-tab"
        class="tab-button active"
        type="button"
      >
        Saison
      </button>

      <button
        id="matchday-tab"
        class="tab-button"
        type="button"
      >
        Spieltag
      </button>
    </nav>

    <section
      id="hero"
      class="hero-card"
    >
      <div
        id="hero-label"
        class="hero-label"
      >
        Tabellenführer
      </div>

      <div
        id="hero-value"
        class="hero-value"
      >
        –
      </div>

      <div
        id="hero-detail"
        class="hero-detail"
      >
        Ergebnisse werden geladen …
      </div>
    </section>

    <div
      id="summary"
      class="summary-grid"
    ></div>

    <section class="card ranking-card">
      <div class="section-heading">
        <h2 id="ranking-title">
          Saisonwertung
        </h2>

        <div class="ranking-controls">
          <span id="ranking-label"></span>

          <select
            id="matchday-select"
            class="matchday-select"
            aria-label="Spieltag auswählen"
            hidden
          ></select>
        </div>
      </div>

      <div
        id="loading"
        class="status"
      >
        Ergebnisse werden geladen …
      </div>

      <div
        id="desktop-ranking"
        class="desktop-ranking"
        hidden
      >
        <div class="table-wrapper">
          <table>
            <thead id="ranking-head"></thead>
            <tbody id="ranking-body"></tbody>
          </table>
        </div>
      </div>

      <div
        id="mobile-ranking"
        class="mobile-ranking"
        hidden
      >
        <div
          id="mobile-ranking-list"
          class="ranking-list"
        ></div>
      </div>
    </section>
  </main>

  <footer id="footer">
    Tasmania Hackentrick · Automatisch ausgewertet
  </footer>

  <script>
    let appData = null;
    let latestMatchday = null;
    let selectedMatchday = null;
    let activeView = "season";

    const seasonTab =
      document.getElementById(
        "season-tab"
      );

    const matchdayTab =
      document.getElementById(
        "matchday-tab"
      );

    const matchdaySelect =
      document.getElementById(
        "matchday-select"
      );

    const rankingLabel =
      document.getElementById(
        "ranking-label"
      );

    const loading =
      document.getElementById(
        "loading"
      );

    const desktopRanking =
      document.getElementById(
        "desktop-ranking"
      );

    const mobileRanking =
      document.getElementById(
        "mobile-ranking"
      );

    seasonTab.addEventListener(
      "click",
      () => {
        setView("season");
      }
    );

    matchdayTab.addEventListener(
      "click",
      () => {
        setView("matchday");
      }
    );

    matchdaySelect.addEventListener(
      "change",
      event => {
        selectedMatchday =
          Number(event.target.value);

        renderMatchdayView();
      }
    );

    function setView(view) {
      activeView = view;

      seasonTab.classList.toggle(
        "active",
        view === "season"
      );

      matchdayTab.classList.toggle(
        "active",
        view === "matchday"
      );

      renderActiveView();
    }

    function createSummaryCard(
      label,
      value,
      accent = "navy"
    ) {
      return `
        <article
          class="
            card
            summary-card
            ${accent}-accent
          "
        >
          <div class="summary-label">
            ${label}
          </div>

          <div class="summary-value">
            ${value}
          </div>
        </article>
      `;
    }

    function getLatestMatchday(
      matchdays
    ) {
      return [...matchdays].sort(
        (a, b) =>
          Number(b.matchday) -
          Number(a.matchday)
      )[0];
    }

    function formatDate(value) {
      if (!value) {
        return "–";
      }

      return new Intl.DateTimeFormat(
        "de-DE",
        {
          dateStyle: "short",
          timeStyle: "short"
        }
      ).format(new Date(value));
    }

    function namesWithMaximum(
      results,
      getValue
    ) {
      const maximum = Math.max(
        ...results.map(getValue)
      );

      return results
        .filter(
          result =>
            getValue(result) === maximum
        )
        .map(result => result.name)
        .join(", ");
    }

    function assignCompetitionRanks(
      rows,
      pointsField
    ) {
      const sorted = [...rows].sort(
        (a, b) => {
          const difference =
            Number(b[pointsField]) -
            Number(a[pointsField]);

          if (difference !== 0) {
            return difference;
          }

          return a.name.localeCompare(
            b.name,
            "de",
            {
              sensitivity: "base"
            }
          );
        }
      );

      let previousPoints = null;
      let currentRank = 0;

      return sorted.map(
        (row, index) => {
          const points =
            Number(row[pointsField]);

          if (
            points !== previousPoints
          ) {
            currentRank = index + 1;
          }

          previousPoints = points;

          return {
            ...row,
            rank: currentRank
          };
        }
      );
    }

    function calculateSeasonRanking(
      data
    ) {
      const totals = new Map();

      for (
        const name
        of data.participants
      ) {
        totals.set(name, {
          name,
          tsPoints: 0,
          msPoints: 0,
          totalPoints: 0,
          matchdayWins: 0
        });
      }

      for (
        const matchday
        of data.matchdays
      ) {
        for (
          const result
          of matchday.results
        ) {
          const participant =
            totals.get(result.name);

          if (!participant) {
            continue;
          }

          participant.tsPoints +=
            Number(result.ts.points);

          participant.msPoints +=
            Number(result.ms.points);

          participant.totalPoints +=
            Number(
              result.matchday_points
            );

          if (
            Number(
              result.matchday_rank
            ) === 1
          ) {
            participant.matchdayWins +=
              1;
          }
        }
      }

      return assignCompetitionRanks(
        [...totals.values()],
        "totalPoints"
      );
    }

    function populateMatchdaySelect() {
      const sortedMatchdays =
        [...appData.matchdays].sort(
          (a, b) =>
            Number(b.matchday) -
            Number(a.matchday)
        );

      matchdaySelect.innerHTML =
        sortedMatchdays
          .map(
            matchday => `
              <option
                value="${matchday.matchday}"
              >
                Spieltag
                ${matchday.matchday}
              </option>
            `
          )
          .join("");

      matchdaySelect.value =
        String(selectedMatchday);
    }

    function getRankClass(rank) {
      const numericRank =
        Number(rank);

      if (numericRank === 1) {
        return "rank-1";
      }

      if (numericRank === 2) {
        return "rank-2";
      }

      if (numericRank === 3) {
        return "rank-3";
      }

      return "";
    }

    function renderActiveView() {
      if (
        !appData ||
        !latestMatchday
      ) {
        return;
      }

      if (
        activeView === "season"
      ) {
        renderSeasonView();
      } else {
        renderMatchdayView();
      }
    }

    function renderSeasonView() {
      matchdaySelect.hidden = true;
      rankingLabel.hidden = false;

      const ranking =
        calculateSeasonRanking(
          appData
        );

      const leaderNames =
        namesWithMaximum(
          ranking,
          result =>
            result.totalPoints
        );

      const leaderPoints =
        Math.max(
          ...ranking.map(
            result =>
              result.totalPoints
          )
        );

      const bestTs =
        namesWithMaximum(
          ranking,
          result =>
            result.tsPoints
        );

      const bestMs =
        namesWithMaximum(
          ranking,
          result =>
            result.msPoints
        );

      document.getElementById(
        "hero-label"
      ).textContent =
        "Tabellenführer";

      document.getElementById(
        "hero-value"
      ).textContent =
        leaderNames;

      document.getElementById(
        "hero-detail"
      ).textContent =
        `${leaderPoints} Gesamtpunkte`;

      document.getElementById(
        "summary"
      ).innerHTML = [
        createSummaryCard(
          "Bestes Tippspiel",
          bestTs,
          "red"
        ),
        createSummaryCard(
          "Bestes Managerspiel",
          bestMs,
          "navy"
        )
      ].join("");

      document.getElementById(
        "ranking-title"
      ).textContent =
        "Saisonwertung";

      rankingLabel.textContent =
        `${appData.matchdays.length} Spieltag` +
        `${
          appData.matchdays.length === 1
            ? ""
            : "e"
        }`;

      document.getElementById(
        "ranking-head"
      ).innerHTML = `
        <tr>
          <th>Rang</th>
          <th>Spieler</th>
          <th>TS</th>
          <th>MS</th>
          <th>Gesamt</th>
          <th>Tagessiege</th>
        </tr>
      `;

      document.getElementById(
        "ranking-body"
      ).innerHTML =
        ranking
          .map(result => {
            const rankClass =
              getRankClass(
                result.rank
              );

            return `
              <tr>
                <td>
                  <span
                    class="
                      rank-badge
                      ${rankClass}
                    "
                  >
                    ${result.rank}
                  </span>
                </td>

                <td class="player">
                  ${result.name}
                </td>

                <td>
                  ${result.tsPoints}
                </td>

                <td>
                  ${result.msPoints}
                </td>

                <td class="total">
                  ${result.totalPoints}
                </td>

                <td>
                  ${result.matchdayWins}
                </td>
              </tr>
            `;
          })
          .join("");

      document.getElementById(
        "mobile-ranking-list"
      ).innerHTML =
        ranking
          .map(result => {
            const rankClass =
              getRankClass(
                result.rank
              );

            return `
              <article
                class="
                  ranking-item
                  place-${result.rank}
                "
              >
                <span
                  class="
                    rank-badge
                    ${rankClass}
                  "
                >
                  ${result.rank}
                </span>

                <div
                  class="mobile-player"
                >
                  <div
                    class="
                      mobile-player-name
                    "
                  >
                    ${result.name}
                  </div>

                  <div
                    class="
                      mobile-details
                    "
                  >
                    <span
                      class="
                        points-badge
                      "
                    >
                      TS
                      ${result.tsPoints}
                    </span>

                    <span
                      class="
                        points-badge
                        red
                      "
                    >
                      MS
                      ${result.msPoints}
                    </span>

                    <span>
                      ${result.matchdayWins}
                      Tagessieg${
                        result.matchdayWins === 1
                          ? ""
                          : "e"
                      }
                    </span>
                  </div>
                </div>

                <div
                  class="mobile-total"
                >
                  ${result.totalPoints}

                  <span
                    class="
                      mobile-total-label
                    "
                  >
                    Punkte
                  </span>
                </div>
              </article>
            `;
          })
          .join("");
    }

    function renderMatchdayView() {
      const matchday =
        appData.matchdays.find(
          item =>
            Number(
              item.matchday
            ) ===
            Number(
              selectedMatchday
            )
        );

      if (!matchday) {
        return;
      }

      const results =
        [...matchday.results].sort(
          (a, b) => {
            const rankDifference =
              Number(
                a.matchday_rank
              ) -
              Number(
                b.matchday_rank
              );

            if (
              rankDifference !== 0
            ) {
              return rankDifference;
            }

            return a.name.localeCompare(
              b.name,
              "de",
              {
                sensitivity:
                  "base"
              }
            );
          }
        );

      const winnerNames =
        namesWithMaximum(
          results,
          result =>
            result.matchday_points
        );

      const winnerPoints =
        Math.max(
          ...results.map(
            result =>
              result.matchday_points
          )
        );

      const bestTs =
        namesWithMaximum(
          results,
          result =>
            result.ts.points
        );

      const bestMs =
        namesWithMaximum(
          results,
          result =>
            result.ms.points
        );

      document.getElementById(
        "hero-label"
      ).textContent =
        "Mann des Tages";

      document.getElementById(
        "hero-value"
      ).textContent =
        winnerNames;

      document.getElementById(
        "hero-detail"
      ).textContent =
        `${winnerPoints} Punkte am ` +
        `${matchday.matchday}. Spieltag`;

      document.getElementById(
        "summary"
      ).innerHTML = [
        createSummaryCard(
          "Bestes Tippspiel",
          bestTs,
          "red"
        ),
        createSummaryCard(
          "Bestes Managerspiel",
          bestMs,
          "navy"
        )
      ].join("");

      document.getElementById(
        "ranking-title"
      ).textContent =
        "Spieltagswertung";

      rankingLabel.hidden = true;

      matchdaySelect.hidden = false;

      matchdaySelect.value =
        String(
          matchday.matchday
        );

      document.getElementById(
        "ranking-head"
      ).innerHTML = `
        <tr>
          <th>Rang</th>
          <th>Spieler</th>
          <th>TS</th>
          <th>MS</th>
          <th>Gesamt</th>
          <th>Rohpunkte</th>
        </tr>
      `;

      document.getElementById(
        "ranking-body"
      ).innerHTML =
        results
          .map(result => {
            const rankClass =
              getRankClass(
                result.matchday_rank
              );

            return `
              <tr>
                <td>
                  <span
                    class="
                      rank-badge
                      ${rankClass}
                    "
                  >
                    ${result.matchday_rank}
                  </span>
                </td>

                <td class="player">
                  ${result.name}
                </td>

                <td>
                  ${result.ts.points}
                </td>

                <td>
                  ${result.ms.points}
                </td>

                <td class="total">
                  ${result.matchday_points}
                </td>

                <td class="raw">
                  TS
                  ${result.ts.raw_points}
                  ·
                  MS
                  ${result.ms.raw_points}
                </td>
              </tr>
            `;
          })
          .join("");

      document.getElementById(
        "mobile-ranking-list"
      ).innerHTML =
        results
          .map(result => {
            const rankClass =
              getRankClass(
                result.matchday_rank
              );

            return `
              <article
                class="
                  ranking-item
                  place-${result.matchday_rank}
                "
              >
                <span
                  class="
                    rank-badge
                    ${rankClass}
                  "
                >
                  ${result.matchday_rank}
                </span>

                <div
                  class="mobile-player"
                >
                  <div
                    class="
                      mobile-player-name
                    "
                  >
                    ${result.name}
                  </div>

                  <div
                    class="
                      mobile-details
                    "
                  >
                    <span
                      class="
                        points-badge
                      "
                    >
                      TS
                      ${result.ts.points}
                    </span>

                    <span
                      class="
                        points-badge
                        red
                      "
                    >
                      MS
                      ${result.ms.points}
                    </span>

                    <span>
                      Roh:
                      ${result.ts.raw_points}
                      /
                      ${result.ms.raw_points}
                    </span>
                  </div>
                </div>

                <div
                  class="mobile-total"
                >
                  ${result.matchday_points}

                  <span
                    class="
                      mobile-total-label
                    "
                  >
                    Punkte
                  </span>
                </div>
              </article>
            `;
          })
          .join("");
    }

    async function loadData() {
      try {
        const response = await fetch(
          `data.json?timestamp=${Date.now()}`,
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "data.json konnte nicht " +
            "geladen werden: " +
            response.status
          );
        }

        appData =
          await response.json();

        if (
          !Array.isArray(
            appData.matchdays
          ) ||
          appData.matchdays.length === 0
        ) {
          throw new Error(
            "Es sind noch keine " +
            "Spieltage gespeichert."
          );
        }

        if (
          !Array.isArray(
            appData.participants
          ) ||
          appData.participants.length !== 9
        ) {
          throw new Error(
            "Die Teilnehmerliste ist " +
            "nicht vollständig."
          );
        }

        latestMatchday =
          getLatestMatchday(
            appData.matchdays
          );

        if (
          !Array.isArray(
            latestMatchday.results
          ) ||
          latestMatchday.results.length !== 9
        ) {
          throw new Error(
            "Die Spieltagsdaten sind " +
            "nicht vollständig."
          );
        }

        selectedMatchday =
          Number(
            latestMatchday.matchday
          );

        populateMatchdaySelect();
        renderActiveView();

        loading.hidden = true;
        desktopRanking.hidden = false;
        mobileRanking.hidden = false;

        document.getElementById(
          "footer"
        ).textContent =
          "Tasmania Hackentrick · " +
          "Aktualisiert " +
          formatDate(
            appData.updated_at
          );
      } catch (error) {
        console.error(error);

        loading.classList.add(
          "error"
        );

        loading.textContent =
          `Fehler beim Laden: ` +
          `${error.message}`;
      }
    }

    if (
      "serviceWorker" in navigator
    ) {
      navigator.serviceWorker
        .register(
          "service-worker.js",
          {
            updateViaCache: "none"
          }
        )
        .then(
          registration =>
            registration.update()
        )
        .catch(error => {
          console.error(
            "Service Worker konnte " +
            "nicht registriert werden:",
            error
          );
        });
    }

    loadData();
  </script>
</body>
</html>
